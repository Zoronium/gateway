<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Gateway admin</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0d14; --s1: #0f141f; --s2: #161e2e; --s3: #1c2638;
  --line: #1e293b; --line2: #2b3a52;
  --text: #f1f5f9; --muted: #98a6bb; --faint: #7d8ba1;
  --violet: #6366f1; --violet-ink: #c7caff; --on-violet: #ffffff; --violet-btn: #5558e8;
  --cyan: #22c7e6; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --rose: #fb7185;
  --sans: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f2f4f9; --s1: #ffffff; --s2: #eef1f7; --s3: #e4e9f3;
    --line: #dce2ed; --line2: #c3cddf;
    --text: #0f172a; --muted: #46546a; --faint: #5b6a80;
    --violet: #4f46e5; --violet-ink: #3730a3; --on-violet: #ffffff; --violet-btn: #4f46e5;
    --cyan: #0e7490; --ok: #046245; --warn: #8f420d; --bad: #b91c1c; --rose: #be123c;
  }
}
* { box-sizing: border-box; }
html { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); caret-color: var(--violet); -webkit-font-smoothing: antialiased; }
::selection { background: color-mix(in srgb, var(--violet) 40%, transparent); }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.t-warn { color: var(--warn); }
.keycell { font-weight: 500; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* shell */
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100dvh; }
.rail { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; background: var(--s1); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 16px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { font: 500 11px var(--mono); color: var(--faint); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; color: var(--muted); font-weight: 500; transition: background-color .15s, color .15s; }
.nav a:hover { background: var(--s2); color: var(--text); }
.nav a[aria-current="page"] { background: color-mix(in srgb, var(--violet) 16%, transparent); color: var(--violet-ink); }
.nav svg { flex: none; }
.rail-foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
.rail-foot b { color: var(--text); font-weight: 500; }
.main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 24px; background: var(--bg); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; min-width: 92px; }
.search { position: relative; flex: 1 1 280px; max-width: 460px; }
.search svg { position: absolute; left: 10px; top: 8px; color: var(--faint); pointer-events: none; }
.search input[type="text"] { width: 100%; height: 32px; padding: 0 34px 0 32px; background: var(--s1); border: 1px solid var(--line); border-radius: 4px; }
.search input::placeholder { color: var(--faint); }
.search kbd { position: absolute; right: 8px; top: 6px; font: 500 11px var(--mono); color: var(--faint); border: 1px solid var(--line2); border-radius: 3px; padding: 0 5px; line-height: 18px; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; background: var(--s1); overflow: hidden; }
.seg button { height: 30px; padding: 0 11px; border: 0; background: none; color: var(--muted); font: 500 12px var(--sans); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--text); background: var(--s2); }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--violet) 22%, transparent); color: var(--violet-ink); }
.live { display: inline-flex; align-items: center; gap: 7px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.live[aria-pressed="true"] i { background: var(--ok); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line2); background: var(--s1); color: var(--text); font-weight: 500; cursor: pointer; transition: background-color .15s, border-color .15s; }
.btn:hover { background: var(--s2); border-color: var(--line2); }
.btn.primary { background: var(--violet-btn); border-color: var(--violet-btn); color: var(--on-violet); }
.btn.primary:hover { background: color-mix(in srgb, var(--violet-btn) 85%, #000); }
.btn.small { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.danger { color: var(--muted); }
.btn.danger:hover { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.content { padding: 20px 24px 64px; max-width: 1600px; display: grid; gap: 20px; align-content: start; }

/* panels and tables */
.panel { background: var(--s1); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: 48px; }
.panel h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.panel .body { padding: 16px; }
.panel header .spacer + a, .link { color: var(--violet-ink); font-weight: 500; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.num { text-align: right; }
td { padding: 0 12px; height: 36px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--s2); }
tr.row { cursor: pointer; }
tr.row:focus-visible { outline-offset: -2px; }
tr.sel td { background: color-mix(in srgb, var(--violet) 12%, transparent); }
.trunc { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.b { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11.5px; font-weight: 500; background: var(--s3); color: var(--muted); }
.b.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.b.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.b.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.b.violet { background: color-mix(in srgb, var(--violet) 18%, transparent); color: var(--violet-ink); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 4px; background: var(--s2); border: 1px solid var(--line); color: var(--muted); font: 500 11px var(--mono); }
.bar { display: inline-block; vertical-align: middle; width: 64px; height: 5px; border-radius: 2px; background: var(--s3); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cyan); }
.bar.bad i { background: var(--bad); } .bar.warn i { background: var(--warn); } .bar.ok i { background: var(--ok); }
.bar i + i { background: color-mix(in srgb, var(--cyan) 38%, transparent); }
.rule .bar i + i { background: var(--warn); }
.bar.split { display: inline-flex; }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; }
.empty strong { display: block; color: var(--text); font-weight: 600; margin-bottom: 4px; }
.empty pre { margin: 14px auto 0; max-width: 560px; text-align: left; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font: 12px/1.6 var(--mono); color: var(--muted); }
.err { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--bad) 50%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); border-radius: 6px; color: var(--bad); }
.err .spacer { flex: 1; }
.sk { display: block; height: 10px; border-radius: 3px; background: var(--s3); animation: pulse 1.6s ease-in-out infinite; }

/* metric strip */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.m { display: block; padding: 14px 16px 12px; background: var(--s1); min-width: 0; transition: background-color .15s; }
.m:hover { background: var(--s2); }
.m .l { color: var(--muted); font-weight: 500; white-space: nowrap; }
.m .v { margin: 4px 0 2px; font-size: 24px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.m .v small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.m .d { font-size: 12px; color: var(--faint); }
.m .d.up-bad { color: var(--warn); } .m .d.up-good { color: var(--ok); }
.m.alert .v { color: var(--rose); }

/* chart */
.chart { position: relative; padding: 8px 8px 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--faint); font: 10.5px var(--mono); }
.legend { display: flex; gap: 16px; color: var(--muted); font-size: 12px; }
.lg-c { background: var(--cyan); }
.lg-r { background: var(--rose); }
.lg-w { background: var(--warn); opacity: .6; }
a.link + .b { margin-left: 8px; }
.statusline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 14px; line-height: 1.5; }
.statusline b { font-weight: 600; }
.pair { display: grid; gap: 2px; }
td.empty { white-space: normal; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.tip { position: absolute; z-index: 5; pointer-events: none; min-width: 168px; padding: 8px 10px; background: var(--s3); border: 1px solid var(--line2); border-radius: 6px; box-shadow: 0 8px 20px -6px rgba(0,0,0,.45); font-size: 12px; }
.tip b { display: block; margin-bottom: 4px; font-weight: 600; }
.tip div { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); }
.tip div span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
.chart .none { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--muted); pointer-events: none; }

/* forms and filters */
.bar2 { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .lab { color: var(--muted); font-weight: 500; font-size: 12px; }
.field .hint { color: var(--faint); font-size: 12px; }
input[type="text"], input[type="password"], input[type="number"], select { height: 32px; padding: 0 10px; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; min-width: 0; }
input::placeholder { color: var(--faint); }
select { padding-right: 26px; }
.formrow { display: grid; grid-template-columns: minmax(160px, 1fr) minmax(240px, 2fr) 150px 150px auto; gap: 14px; align-items: start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button.chip { cursor: pointer; } button.chip:hover { color: var(--text); border-color: var(--line2); }
.callout { padding: 14px 16px; border: 1px solid color-mix(in srgb, var(--ok) 50%, transparent); background: color-mix(in srgb, var(--ok) 9%, transparent); border-radius: 8px; display: grid; gap: 8px; }
.callout code { display: block; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 13px var(--mono); word-break: break-all; user-select: all; }
.active-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.active-filters .chip { height: 26px; padding: 0 4px 0 9px; }
.active-filters .chip button { all: unset; cursor: pointer; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 3px; color: var(--faint); }
.active-filters .chip button:hover { background: var(--s3); color: var(--text); }

/* scale (filter thresholds) */
.scale { position: relative; height: 10px; border-radius: 3px; background: linear-gradient(to right, var(--s3) 0 var(--a), color-mix(in srgb, var(--warn) 55%, var(--s3)) var(--a) var(--b), color-mix(in srgb, var(--bad) 65%, var(--s3)) var(--b) 100%); }
.scale i { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--text); border-radius: 1px; }
.scale-l { position: relative; height: 16px; margin-top: 6px; color: var(--faint); font: 11px var(--mono); }
.scale-l span { position: absolute; top: 0; white-space: nowrap; transform: translateX(-50%); }
.scale-l span:first-child { transform: none; }
.scale-l span:last-child { transform: translateX(-100%); }
.rules { display: grid; }
.rule .mono { white-space: nowrap; }
.rule { display: grid; grid-template-columns: minmax(150px, max-content) minmax(60px, 1fr) auto; gap: 14px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line); }
.rule:last-child { border-bottom: 0; }
.rule .bar { width: 100%; height: 6px; } .rule .bar i { background: var(--rose); }
dl.kv { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; margin: 0; }
dl.kv dt, dl.kv dd { margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--line); }
dl.kv dt { color: var(--muted); } dl.kv dd { min-width: 0; word-break: break-word; }
dl.kv > :nth-last-child(-n+2) { border-bottom: 0; }

/* inspector */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: min(440px, 100vw); display: flex; flex-direction: column; background: var(--s1); border-left: 1px solid var(--line2); box-shadow: -18px 0 44px -14px rgba(0,0,0,.55); transform: translateX(104%); transition: transform .2s cubic-bezier(.16, 1, .3, 1); visibility: hidden; }
.drawer.open { transform: none; visibility: visible; }
.alist { display: grid; }
.arow { display: grid; gap: 5px; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.arow:last-child { border-bottom: 0; }
.arow:hover { background: var(--s2); }
.arow.sel { background: color-mix(in srgb, var(--violet) 12%, transparent); }
.arow:focus-visible { outline-offset: -2px; }
.a1, .a2 { display: flex; align-items: center; gap: 10px; min-width: 0; }
.a2 { font-size: 12px; color: var(--muted); }
.a1 .grow { flex: 1; }
.a1 .b { min-width: 96px; justify-content: center; }
.a1 .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: none; }
.a1 .faint { white-space: nowrap; flex: none; }
.stack { display: grid; gap: 20px; align-content: start; min-width: 0; }
.a1 .trunc { flex: 0 1 auto; min-width: 0; }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; font-size: 14px; font-weight: 600; }
.drawer .scroll { overflow: auto; padding: 16px; display: grid; gap: 18px; align-content: start; }
.drawer h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.why { margin: 0; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; line-height: 1.55; }
.dr { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 0; }
.dr dt { color: var(--muted); } .dr dd { margin: 0; min-width: 0; word-break: break-word; }
.span { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--s3); }
.span i { display: block; height: 100%; }
.span i:first-child { background: var(--cyan); } .span i + i { background: color-mix(in srgb, var(--cyan) 38%, transparent); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }

@media (min-width: 1181px) { .strip.seven { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
.strip > :nth-child(7):last-child { grid-column: auto; }
@media (max-width: 1180px) { .strip > :nth-child(7):last-child { grid-column: 1 / -1; } }
@media (max-width: 1180px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cols { grid-template-columns: 1fr; } .formrow { grid-template-columns: 1fr 1fr; } }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 0 6px 0 0; width: 100%; } .nav { flex-direction: row; flex-wrap: wrap; } .nav a { padding: 0 10px; white-space: nowrap; } .rail-foot { display: none; }
  .top { padding: 8px 12px; flex-wrap: wrap; } .top h1 { display: none; } .search { flex-basis: 100%; max-width: none; order: 5; }
  .content { padding: 16px 12px 48px; }
}
.msub { display: none; }
@media (max-width: 700px) { .hm { display: none; } .trunc { max-width: 150px; } .msub { display: block; max-width: 160px; white-space: normal; overflow-wrap: anywhere; font-weight: 400; color: var(--faint); } }
@media (max-width: 560px) { .ptbl .bar, .ptbl .fb { display: none; } .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .formrow { grid-template-columns: 1fr; } dl.kv { grid-template-columns: 1fr; } dl.kv dt { padding-bottom: 0; border-bottom: 0; } .rule { grid-template-columns: 1fr auto; } .rule .bar { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.login { max-width: 400px; margin: 14vh auto 0; padding: 0 16px; }
.login .panel .body { display: grid; gap: 14px; }
.login h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
</style>
